# Publishes to npm on release.
#
# One-time setup by the maintainer:
#   1. npm token (Automation type) -> repo Settings -> Secrets -> NPM_TOKEN
#   2. then: git tag v0.1.1 && git push origin v0.1.1
#      (or create a release in the GitHub UI)
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json 的 engines 要求 >=22.5（OpenCode 通道依赖 node:sqlite
          # 的 DatabaseSync，它在 22.5 才落地）。这里必须一致，否则发布环境
          # 比运行要求还旧，装出来的包在用的时候才会炸。
          node-version: '22.5'
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
