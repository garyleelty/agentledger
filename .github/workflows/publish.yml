# Publishes to npm on release.
#
# One-time setup by the maintainer:
#   1. npm token (Automation type) -> repo Settings -> Secrets -> NPM_TOKEN
#   2. then: git tag v0.1.1 && git push origin v0.1.1
#      (or create a release in the GitHub UI)
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
