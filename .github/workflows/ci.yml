# 每次 push / PR 都跑测试与 lint。
#
# 之前仓库只有 publish.yml 和 digest.yml，而 publish 只在发版时触发 ——
# 也就是说日常改动根本没有 CI 把关。结果是 `npm test` 悄悄坏掉了都没人发现
# （脚本写的是 `node --test tests/`，在 Node 22+ 上会把 tests 当成模块路径，
# 报 MODULE_NOT_FOUND，0 通过 1 失败，而实际有 55 个测试是好的）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays ~06:17 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.5 是下限（OpenCode 通道依赖 node:sqlite 的 DatabaseSync）；
        # 24/26 覆盖当前 LTS 与 Latest，防住只在新版出现的回归。
        node: ['22.5', '24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Lint (syntax check)
        run: npm run lint

      - name: Test
        run: npm test

      # The docs quote this machine's real ledger, which grows whenever the
      # maintainer works. Regenerate from the committed sample and fail if the
      # result differs — a stale figure is a wrong claim, not a cosmetic nit.
      - name: Docs match the committed sample
        run: |
          node tools/sync-docs.mjs
          if ! git diff --quiet -- README.md docs/index.html; then
            echo "::error::README/landing figures are stale; run: node tools/sync-docs.mjs"
            git diff --stat -- README.md docs/index.html
            exit 1
          fi

  # Weekly pricing audit against the authoritative LiteLLM model database.
  # A cost tool's numbers rot when providers reprice; this is the guard that
  # catches gpt-5-class mistakes (absolute price pasted into a multiplier
  # field) on a schedule instead of waiting for a user to notice a wrong bill.
  pricing-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - name: Fetch LiteLLM model db
        run: |
          curl -sSL -o /tmp/litellm.json https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
      - name: Audit pricing table
        run: python3 tools/audit_pricing.py /tmp/litellm.json
