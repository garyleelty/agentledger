# 每次 push / PR 都跑测试与 lint。
#
# 之前仓库只有 publish.yml 和 digest.yml，而 publish 只在发版时触发 ——
# 也就是说日常改动根本没有 CI 把关。结果是 `npm test` 悄悄坏掉了都没人发现
# （脚本写的是 `node --test tests/`，在 Node 22+ 上会把 tests 当成模块路径，
# 报 MODULE_NOT_FOUND，0 通过 1 失败，而实际有 55 个测试是好的）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.5 是下限（OpenCode 通道依赖 node:sqlite 的 DatabaseSync）；
        # 24/26 覆盖当前 LTS 与 Latest，防住只在新版出现的回归。
        node: ['22.5', '24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Lint (syntax check)
        run: npm run lint

      - name: Test
        run: npm test
