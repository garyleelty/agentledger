# Runs the test suite and the syntax lint on every push and PR.
#
# This exists because `npm test` was broken (`node --test tests/` cannot load
# a bare directory on Node 22+) and no CI was there to catch it before the
# claim "tests green" got written into the README. The guardrail is the test
# run itself, not remembering to run it locally.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run lint
      - run: npm test
