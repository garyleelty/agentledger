# Publishes a periodic cost digest to the repo's Pages site.
#
# This is exposure work: a live, dated page of real agent-spend data is
# something people can link to and argue with, which a README is not.
#
# The numbers come from `digests/samples/latest.json`, committed by the
# maintainer with:
#
#     agentledger aggregate > digests/samples/latest.json
#
# Three earlier designs were wrong and are worth reading before changing this.
# The first ran `agentledger` on the GitHub runner, which has no ~/.claude,
# ~/.codex or opencode.db, so every scheduled publish wrote all-zero totals and
# an empty table — and the cron made it look like a real reading. The second
# kept reading the runner's own logs but refused to publish when it found
# nothing, which only converts a silent wrong answer into a loud one: the page
# still has no data, because the runner is not the machine whose spend is being
# published.
#
# So the page is built from a committed sample, refreshed by hand.
#
# Runs weekly and on demand. Publishes aggregates only — no session ids, no
# file paths, no per-record rows. See `aggregate` vs `json` in the README.
name: digest

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Ledger JSON to render (path in the repo)'
        required: false
        default: 'digests/samples/latest.json'

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # SOURCE is resolved in the shell, not through a `${{ }}` expression:
      # `inputs.source || default` collapses to an *empty string* when the
      # dispatch carries no input, and readFileSync(undefined) then fails the
      # run. A defaulted shell variable cannot be empty.
      - name: Resolve the digest source
        run: |
          echo "SOURCE=${SOURCE_DEFAULT}" >> "$GITHUB_ENV"
        env:
          SOURCE_DEFAULT: ${{ inputs.source || 'digests/samples/latest.json' }}

      - name: Render the digest
        run: |
          test -f "$SOURCE" || { echo "::error::no such digest source: $SOURCE"; exit 1; }
          node bin/digest.js "$SOURCE" digest.md
          echo "---- digest.md ----"
          cat digest.md

      # A digest of zeros or of a missing file is worse than no digest: it
      # looks like an authoritative reading and it is not one. The check lives
      # in bin/digest.js so it runs locally too, rather than in a shell-quoted
      # `node -e` body that only CI executes.
      - name: Refuse to publish an empty digest
        run: node bin/digest.js --check "$SOURCE" digest.md

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Build a branch holding index.md only. Keeping the checked-out tree
          # would publish the whole repo -- private notes included -- to the web.
          git checkout --orphan gh-pages
          # digest.md is moved out of the tree before it is cleared, or the
          # cleanup deletes the very file we came to publish.
          mv digest.md /tmp/digest.md
          git rm -rf --cached . >/dev/null 2>&1 || true
          git read-tree --empty
          git clean -fdx >/dev/null 2>&1 || true
          mv /tmp/digest.md index.md
          git add index.md
          git commit -m "digest: $(date -u +%F)"
          git push -f origin gh-pages
